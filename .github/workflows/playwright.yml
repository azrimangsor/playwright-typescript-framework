name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: UI and API tests
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    outputs:
      tests-completed: ${{ steps.tests.outcome == 'success' || steps.tests.outcome == 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@28802689a136bfcdb721715abd713740beecbe07

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run UI and API examples
        id: tests
        run: npm test

      - name: Upload test results and Playwright report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: Generate dashboard
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.tests-completed == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@28802689a136bfcdb721715abd713740beecbe07

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test dashboard generator
        run: npm run test:dashboard

      - name: Download test results and Playwright report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-results

      - name: Restore published dashboard history
        run: |
          published_branch=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [ -z "$published_branch" ]; then
            echo "No gh-pages branch yet; starting dashboard history."
          else
            git fetch --depth=1 origin gh-pages
            history_file=$(git ls-tree --name-only FETCH_HEAD history/history.json)
            if [ -n "$history_file" ]; then
              mkdir -p dashboard
              git show FETCH_HEAD:history/history.json > dashboard/history.json
            else
              echo "No published dashboard history yet; starting dashboard history."
            fi
          fi

      - name: Generate engineering dashboard
        run: |
          npm run dashboard
          test -s dashboard/index.html
          test -s dashboard/history.json
          test -s playwright-report/index.html

      - name: Upload dashboard and Playwright report
        id: dashboard-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-dashboard
          path: |
            dashboard/
            playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Link dashboard artifact in Actions summary
        env:
          ARTIFACT_URL: ${{ steps.dashboard-artifact.outputs.artifact-url }}
        run: |
          printf '### Engineering dashboard\n\n[Download dashboard and Playwright report](%s)\n\nExtract the artifact and open `dashboard/index.html`.\n\nDefault-branch runs also publish a live link in the **Publish dashboard** job summary after deployment. Other branches and pull requests are artifact-only.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare GitHub Pages site
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          run_path="runs/$GITHUB_RUN_NUMBER/$GITHUB_RUN_ATTEMPT"
          mkdir -p "_site/$run_path" _site/history
          cp -R dashboard playwright-report _site/
          cp -R dashboard playwright-report "_site/$run_path/"
          cp dashboard/history.json _site/history/history.json
          cp .github/pages/index.html _site/index.html
          test -s "_site/$run_path/dashboard/index.html"
          test -s "_site/$run_path/dashboard/history.json"
          test -s "_site/$run_path/playwright-report/index.html"

      - name: Upload GitHub Pages site
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages-site
          path: _site/
          if-no-files-found: error
          retention-days: 7

  deploy-dashboard:
    name: Publish dashboard
    needs: dashboard
    if: ${{ !cancelled() && needs.dashboard.result == 'success' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ vars.PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: Download generated site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages-site
          path: published-site

      - name: Verify published report files
        run: |
          test -s published-site/index.html
          test -s published-site/history/history.json
          test -s "published-site/runs/$GITHUB_RUN_NUMBER/$GITHUB_RUN_ATTEMPT/dashboard/index.html"
          test -s "published-site/runs/$GITHUB_RUN_NUMBER/$GITHUB_RUN_ATTEMPT/playwright-report/index.html"

      - name: Publish reports to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: published-site
          keep_files: true

      - name: Request GitHub Pages build
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            let site;
            try {
              ({ data: site } = await github.rest.repos.getPages({ owner, repo }));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setFailed('Reports were pushed to gh-pages, but Pages is not enabled. In Settings > Pages select Deploy from a branch > gh-pages > /(root), then rerun this workflow.');
              return;
            }
            if (site.build_type !== 'legacy' || site.source?.branch !== 'gh-pages' || site.source?.path !== '/') {
              core.setFailed('Pages must use Deploy from a branch > gh-pages > /(root). Update Settings > Pages, then rerun this workflow.');
              return;
            }
            await github.rest.repos.requestPagesBuild({ owner, repo });
            core.info('GitHub Pages build requested. Check the Pages build for deployment status.');

      - name: Link live dashboard in Actions summary
        env:
          PAGES_URL: ${{ vars.PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          pages_url="${PAGES_URL%/}"
          run_url="$pages_url/runs/$GITHUB_RUN_NUMBER/$GITHUB_RUN_ATTEMPT"
          {
            echo "### Engineering dashboard"
            echo ""
            echo "- [View dashboard for this run]($run_url/dashboard/index.html)"
            echo "- [View Playwright report for this run]($run_url/playwright-report/index.html)"
            echo "- [View latest dashboard]($pages_url/dashboard/index.html)"
            echo ""
            echo "Files were pushed to gh-pages and a Pages build was requested. Check the Pages build for completion; the site may take a few minutes to update."
            echo "One-time setup: Settings > Pages > Deploy from a branch > gh-pages > /(root)."
          } >> "$GITHUB_STEP_SUMMARY"
